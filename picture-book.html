<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>호기심 먹는 괴물과 호기심 대장</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0c1a;
      background-image:
        radial-gradient(ellipse at 20% 50%, #1e0f38 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, #0f1e38 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, #28100a 0%, transparent 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif KR', 'Georgia', serif;
      overflow: hidden;
      user-select: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 8% 12%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 7%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 38% 18%, rgba(255,220,150,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 5%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 70% 14%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 9%, rgba(200,200,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 35%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 38%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 3% 65%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 91% 58%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 28% 80%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 74% 92%, rgba(255,255,255,0.6) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top bar */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, transparent 100%);
    }

    .back-link {
      color: rgba(245, 230, 200, 0.7);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #f5e6c8; }
    .back-link::before { content: '← '; }

    .book-title {
      color: #f5e6c8;
      font-size: clamp(12px, 2vw, 15px);
      font-weight: 600;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
      text-align: center;
    }

    .page-counter {
      color: rgba(245, 230, 200, 0.75);
      font-size: 13px;
      background: rgba(0,0,0,0.4);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(245, 230, 200, 0.2);
      min-width: 80px;
      text-align: center;
    }

    /* Book area */
    #book-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      padding: 68px 80px 56px;
    }

    /* Flip scene */
    #scene {
      perspective: 1800px;
      position: relative;
    }

    /* The two canvas layers */
    .page-canvas {
      display: block;
      border-radius: 4px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 4px 16px rgba(0,0,0,0.5);
      background: #f8f4ee;
      position: absolute;
      top: 0; left: 0;
      backface-visibility: hidden;
    }

    /* page-a is the "current" page, page-b is the "incoming" page */
    #page-a { transform: rotateY(0deg); z-index: 2; }
    #page-b { transform: rotateY(90deg); z-index: 1; }

    /* Placeholder for layout (sets scene size) */
    #page-placeholder { display: block; visibility: hidden; }

    /* Nav buttons */
    .nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 230, 200, 0.35);
      background: rgba(0,0,0,0.45);
      color: #f5e6c8;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      backdrop-filter: blur(6px);
    }
    .nav-btn:hover {
      background: rgba(110, 70, 20, 0.65);
      border-color: rgba(245, 230, 200, 0.8);
      transform: translateY(-50%) scale(1.08);
    }
    .nav-btn:active { transform: translateY(-50%) scale(0.94); }
    .nav-btn:disabled { opacity: 0.18; cursor: default; pointer-events: none; }
    #prev-btn { left: 16px; }
    #next-btn { right: 16px; }

    /* Bottom */
    .bottom-controls {
      position: fixed;
      bottom: 14px; left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex; align-items: center; gap: 10px;
    }

    .page-input-wrapper {
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(245,230,200,0.2);
      border-radius: 20px;
      padding: 5px 14px;
      backdrop-filter: blur(6px);
    }
    .page-input-wrapper label { color: rgba(245,230,200,0.65); font-size: 12px; }
    #page-jump {
      background: transparent; border: none;
      color: #f5e6c8; font-size: 13px;
      width: 44px; text-align: center; outline: none;
    }
    #page-jump::-webkit-inner-spin-button,
    #page-jump::-webkit-outer-spin-button { -webkit-appearance: none; }

    .icon-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(245,230,200,0.25);
      background: rgba(0,0,0,0.45);
      color: #f5e6c8; font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      backdrop-filter: blur(6px);
    }
    .icon-btn:hover { background: rgba(110,70,20,0.6); border-color: rgba(245,230,200,0.65); }

    .hint {
      position: fixed;
      bottom: 58px; left: 50%;
      transform: translateX(-50%);
      color: rgba(245,230,200,0.3);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
      z-index: 50;
      white-space: nowrap;
    }

    /* Loading */
    #loading {
      position: fixed; inset: 0;
      background: #0e0c1a;
      background-image:
        radial-gradient(ellipse at 30% 40%, #1e0f38 0%, transparent 50%),
        radial-gradient(ellipse at 70% 70%, #0f1e38 0%, transparent 50%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s;
    }
    .loading-emoji { font-size: 48px; margin-bottom: 20px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .loading-title {
      color: #f5e6c8; font-size: clamp(16px, 3vw, 24px);
      font-weight: 700; margin-bottom: 6px;
      text-align: center; line-height: 1.5;
      text-shadow: 0 0 40px rgba(255, 200, 100, 0.4);
    }
    .loading-sub { color: rgba(245,230,200,0.5); font-size: 13px; margin-bottom: 28px; }
    .loading-bar-wrap { width: 200px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    .loading-bar { height: 100%; background: linear-gradient(to right, #f5c842, #ff8c42); border-radius: 2px; width: 0%; transition: width 0.3s; }
    .loading-pct { color: rgba(245,230,200,0.45); font-size: 12px; margin-top: 10px; }

    @media (max-width: 640px) {
      #book-wrapper { padding: 60px 44px 52px; }
      .nav-btn { width: 38px; height: 38px; font-size: 17px; }
      #prev-btn { left: 6px; }
      #next-btn { right: 6px; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="loading-emoji">📖</div>
  <div class="loading-title">호기심 먹는 괴물과<br>호기심 대장</div>
  <div class="loading-sub">동화책을 불러오는 중...</div>
  <div class="loading-bar-wrap">
    <div class="loading-bar" id="loading-bar"></div>
  </div>
  <div class="loading-pct" id="loading-pct">잠시만 기다려 주세요</div>
</div>

<div class="top-bar">
  <a class="back-link" href="index.html">포트폴리오</a>
  <div class="book-title">호기심 먹는 괴물과 호기심 대장</div>
  <div class="page-counter" id="page-counter">— / —</div>
</div>

<div id="book-wrapper">
  <div id="scene">
    <canvas id="page-placeholder"></canvas>
    <canvas id="page-a" class="page-canvas"></canvas>
    <canvas id="page-b" class="page-canvas"></canvas>
  </div>
</div>

<button class="nav-btn" id="prev-btn">&#8592;</button>
<button class="nav-btn" id="next-btn">&#8594;</button>

<div class="hint">← → 키보드 · 클릭 · 스와이프로 넘기기</div>

<div class="bottom-controls">
  <button class="icon-btn" id="full-btn" title="전체화면">⛶</button>
  <div class="page-input-wrapper">
    <label for="page-jump">페이지</label>
    <input type="number" id="page-jump" min="1" value="1" />
    <label id="total-label">/ —</label>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const PDF_URL = 'picturebook.pdf';
  const SCALE   = 2;

  let pdfDoc     = null;
  let totalPages = 0;
  let currentPage = 1;
  let isFlipping  = false;

  const pageA      = document.getElementById('page-a');
  const pageB      = document.getElementById('page-b');
  const placeholder= document.getElementById('page-placeholder');
  const scene      = document.getElementById('scene');
  const counter    = document.getElementById('page-counter');
  const totalLbl   = document.getElementById('total-label');
  const jumpInput  = document.getElementById('page-jump');
  const loadEl     = document.getElementById('loading');
  const loadBar    = document.getElementById('loading-bar');
  const loadPct    = document.getElementById('loading-pct');
  const prevBtn    = document.getElementById('prev-btn');
  const nextBtn    = document.getElementById('next-btn');

  // Which canvas is currently "front"
  let frontCanvas = pageA;
  let backCanvas  = pageB;

  async function renderPage(num, canvas) {
    const page = await pdfDoc.getPage(num);
    const vp   = page.getViewport({ scale: SCALE });
    canvas.width  = vp.width;
    canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  }

  function fitBook() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const aw = vw - 100;
    const ah = vh - 124;

    const cw = frontCanvas.width  || 1191;
    const ch = frontCanvas.height || 1684;
    const aspect = ch / cw;

    let w = aw;
    let h = w * aspect;
    if (h > ah) { h = ah; w = h / aspect; }

    // CSS-scale both canvases to display size
    [pageA, pageB, placeholder].forEach(c => {
      c.style.width  = w + 'px';
      c.style.height = h + 'px';
    });
    scene.style.width  = w + 'px';
    scene.style.height = h + 'px';
  }

  function updateUI() {
    counter.textContent  = `${currentPage} / ${totalPages}`;
    jumpInput.value      = currentPage;
    prevBtn.disabled     = currentPage <= 1;
    nextBtn.disabled     = currentPage >= totalPages;
  }

  // Flip animation: front folds away, back reveals
  async function goToPage(target, dir) {
    if (isFlipping || target < 1 || target > totalPages) return;
    if (target === currentPage) return;
    isFlipping = true;

    // Render next page on back canvas (hidden at 90deg)
    await renderPage(target, backCanvas);
    fitBook();

    // Make sure back starts at 90deg (or -90deg depending on direction)
    const startAngle = dir > 0 ? 90 : -90;
    backCanvas.style.transition  = 'none';
    backCanvas.style.transform   = `rotateY(${startAngle}deg)`;
    backCanvas.style.zIndex      = '1';
    frontCanvas.style.zIndex     = '2';

    // Force reflow
    backCanvas.getBoundingClientRect();

    const HALF = 200; // ms per half-flip

    // Phase 1: front folds to 90deg (disappears)
    frontCanvas.style.transition = `transform ${HALF}ms ease-in`;
    frontCanvas.style.transform  = `rotateY(${dir > 0 ? -90 : 90}deg)`;

    await delay(HALF);

    // Phase 2: back unfolds from 90deg to 0 (appears)
    backCanvas.style.transition = `transform ${HALF}ms ease-out`;
    backCanvas.style.transform  = 'rotateY(0deg)';
    backCanvas.style.zIndex     = '2';
    frontCanvas.style.zIndex    = '1';

    await delay(HALF);

    // Swap front/back references
    [frontCanvas, backCanvas] = [backCanvas, frontCanvas];

    // Reset the now-hidden canvas (no transition)
    backCanvas.style.transition = 'none';
    backCanvas.style.transform  = `rotateY(${dir > 0 ? 90 : -90}deg)`;

    currentPage = target;
    isFlipping  = false;
    updateUI();
  }

  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function init() {
    try {
      const task = pdfjsLib.getDocument({
        url: PDF_URL,
        cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
        cMapPacked: true,
      });
      task.onProgress = p => {
        if (p.total) {
          const pct = Math.round(p.loaded / p.total * 100);
          loadBar.style.width  = pct + '%';
          loadPct.textContent  = `로딩 중... ${pct}%`;
        }
      };

      pdfDoc      = await task.promise;
      totalPages  = pdfDoc.numPages;
      totalLbl.textContent = `/ ${totalPages}`;
      jumpInput.max = totalPages;

      loadPct.textContent = '첫 페이지 렌더링 중...';
      loadBar.style.width = '100%';

      // Render page 1 on front canvas
      await renderPage(1, frontCanvas);

      // Set placeholder same size for layout
      placeholder.width  = frontCanvas.width;
      placeholder.height = frontCanvas.height;

      fitBook();
      updateUI();

      loadEl.style.opacity = '0';
      setTimeout(() => loadEl.style.display = 'none', 800);

    } catch(e) {
      loadPct.textContent = '오류: PDF를 불러올 수 없습니다.';
      console.error(e);
    }
  }

  // Events
  prevBtn.addEventListener('click', () => goToPage(currentPage - 1, -1));
  nextBtn.addEventListener('click', () => goToPage(currentPage + 1, +1));

  document.addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) { e.preventDefault(); goToPage(currentPage + 1, +1); }
    if (['ArrowLeft',  'ArrowUp'       ].includes(e.key)) { e.preventDefault(); goToPage(currentPage - 1, -1); }
  });

  // Click left half → prev, right half → next
  scene.addEventListener('click', e => {
    const mid = scene.getBoundingClientRect().left + scene.offsetWidth / 2;
    e.clientX < mid ? goToPage(currentPage - 1, -1) : goToPage(currentPage + 1, +1);
  });

  // Touch swipe
  let tx = 0;
  document.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 45) dx < 0 ? goToPage(currentPage + 1, +1) : goToPage(currentPage - 1, -1);
  }, { passive: true });

  jumpInput.addEventListener('change', () => {
    const p = parseInt(jumpInput.value);
    if (p >= 1 && p <= totalPages) goToPage(p, p > currentPage ? 1 : -1);
  });

  document.getElementById('full-btn').addEventListener('click', () => {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });

  window.addEventListener('resize', fitBook);

  init();
</script>
</body>
</html>
