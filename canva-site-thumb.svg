<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff65d9"/>
      <stop offset="100%" style="stop-color:#f965d6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="5" fill="url(#pink)"/>

  <!-- Pink glow circle -->
  <circle cx="650" cy="100" r="120" fill="#ff65d9" opacity="0.08"/>
  <circle cx="150" cy="400" r="90" fill="#ff65d9" opacity="0.06"/>

  <!-- Main title -->
  <text x="80" y="180" font-family="Arial Black, sans-serif" font-size="58" font-weight="900" fill="#000000" letter-spacing="-2">FUNNY</text>
  <text x="80" y="248" font-family="Arial Black, sans-serif" font-size="58" font-weight="900" fill="url(#pink)" letter-spacing="-2" filter="url(#glow)">SLIME</text>

  <!-- Subtitle -->
  <text x="80" y="295" font-family="Arial, sans-serif" font-size="16" fill="#888" letter-spacing="4">BRANDING &amp; DESIGN</text>

  <!-- Divider line -->
  <rect x="80" y="318" width="60" height="3" fill="url(#pink)" rx="2"/>

  <!-- Tags -->
  <rect x="80" y="340" width="110" height="28" rx="14" fill="#ff65d9" opacity="0.12"/>
  <text x="135" y="359" font-family="Arial, sans-serif" font-size="12" fill="#ff65d9" text-anchor="middle" font-weight="600">브랜딩</text>

  <rect x="200" y="340" width="110" height="28" rx="14" fill="#000" opacity="0.06"/>
  <text x="255" y="359" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="600">로고디자인</text>

  <rect x="320" y="340" width="110" height="28" rx="14" fill="#000" opacity="0.06"/>
  <text x="375" y="359" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="600">키즈카페</text>

  <!-- Right decorative elements -->
  <!-- Slime blobs -->
  <ellipse cx="580" cy="250" rx="130" ry="140" fill="#ff65d9" opacity="0.10"/>
  <ellipse cx="590" cy="260" rx="100" ry="110" fill="#ff65d9" opacity="0.12"/>

  <!-- Star/sparkle shapes -->
  <g transform="translate(540,160) rotate(15)">
    <polygon points="0,-18 4,-6 18,-6 7,4 11,18 0,10 -11,18 -7,4 -18,-6 -4,-6" fill="#ff65d9" opacity="0.6"/>
  </g>
  <g transform="translate(680,200) rotate(-10)">
    <polygon points="0,-12 3,-4 12,-4 5,3 7,12 0,7 -7,12 -5,3 -12,-4 -3,-4" fill="#ff65d9" opacity="0.4"/>
  </g>
  <g transform="translate(620,320) rotate(20)">
    <polygon points="0,-9 2,-3 9,-3 4,2 5,9 0,5 -5,9 -4,2 -9,-3 -2,-3" fill="#000" opacity="0.15"/>
  </g>

  <!-- URL tag -->
  <rect x="490" y="430" width="230" height="36" rx="18" fill="#000" opacity="0.07"/>
  <text x="605" y="453" font-family="Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">canva.site / funnyslime</text>

  <!-- Year -->
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="13" fill="#aaa">2026</text>
</svg>
