<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Subtle grain texture lines -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Decorative circle -->
  <circle cx="200" cy="130" r="70" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="200" cy="130" r="55" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Brand name -->
  <text x="200" y="118" font-family="Georgia, serif" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="6" font-weight="400">FIFTH</text>
  <text x="200" y="138" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="4">&amp;</text>
  <text x="200" y="158" font-family="Georgia, serif" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="6" font-weight="400">OATS</text>
  <!-- Tagline -->
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="3">BRANDING</text>
</svg>
